<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Card info - Urza\'s Oracle')}"></head>

</head>

<body class="bg-dark text-light">
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container-fluid ">
    <div class="row">
      <!-- Immagine Carta -->

      <div class="col-sm-4 pt-4 ">
        <div class="card-container">
          <div id="dragCard" class="magic-card">
            <div class="card-face card-front">
              <img th:if="${card.images != null and card.images['png'] != null}" th:src="${card.images['png']}"
                th:alt="${card.name}" class="img-fluid shadow" style="
              width: 100%;
              aspect-ratio: 488/680;
              object-fit: contain;
              border: 2px solid rgba(255, 193, 7, 0.2);
              background: rgba(26, 16, 51, 0.5);
              border-radius:7%/5.0235% ;
              background-repeat: no-repeat;
            " />
            </div>

            <div class="card-face card-back">
              <div class="card-back-imageflip">
                <img th:if="${card.backFace != null and card.backFace.images['png'] != null}"
                  th:src="${card.backFace.images['png']}" th:alt="${card.name}" class="img-fluid shadow" style="
              width: 100%;
              aspect-ratio: 488/680;
              object-fit: contain;
              border: 2px solid rgba(255, 193, 7, 0.2);
              border-radius:7%/5.0235% ;
              background-repeat: no-repeat;

              background: rgba(26, 16, 51, 0.5);
            " />
              </div>
            </div>
          </div>
        </div>
        <div th:if="${card.images == null or card.images['png'] == null}"
          class="w-100  d-flex align-items-center justify-content-center text-secondary" style="
              aspect-ratio: 488/680;
              background: rgba(108, 117, 125, 0.2);
              border: 2px dashed rgba(255, 193, 7, 0.2);
            ">
          <span>No Image</span>
        </div>
      </div>
      <!-- Informazioni sulla carta -->

      <div class="col-sm-7 p-4 cardinfoholder">
        <div class="row">
          <!-- Nome e Tipo -->
          <div class="col-lg-12">
            <h1 class="fw-bold text-warning mb-2" style="
                font-size: 2.2rem;
                text-shadow: 0 0 20px rgba(255, 193, 7, 0.4);
                /* font-family: 'Georgia', serif; */
              " th:text="${card.name}"></h1>
            <p class="text-secondary mb-1" style="font-size: 1.1rem; font-weight: 500" th:text="${card.typeline}"></p>
          </div>
        </div>
        <!-- <hr class="border-warning mb-4" style="opacity: 0.3" /> -->


        <hr class="border-warning mb-4" style="opacity: 0.3" />
        <div class="row">

          <!-- Oracle Text -->
          <div class="col-sm-7 mb-4" th:if="${card.oracleText != null and card.oracleText != ''}">
            <small class="text-secondary d-block mb-2">ORACLE TEXT</small>
            <p class="text-light replaceCandidate" style="
                white-space: pre-wrap;
                line-height: 1.6;
                font-size: 0.95rem;
                " th:text="${card.oracleText}"></p>
          </div>
          <div class="col-sm-4 ms-auto">
            <div class="row"
              style="background-color: #444; box-shadow: 0 4px 8px rgba(0,0,0,0.3) ; border-radius: 0.5rem ; color: white; margin-top: 0; padding: auto;">
              <!-- Mana Cost come testo -->
              <div class="col-7" th:if="${card.manaCost != null and card.manaCost != ''}">
                <small class="text-secondary">MANA COST</small>
                <p class="text-light mb-0 fs-5 replaceCandidate" style="font-size: 1.1rem" th:text="${card.manaCost}">
                </p>
              </div>

              <!-- Dati set, rarità, numero -->
              <div class="col-2">
                <small class="text-secondary">SET</small>
                <p class="text-light mb-0 fs-5">
                  <img width="30px" height="30px" th:src="${card.expansionSet.icon_svg_uri}"></img>
                </p>
              </div>
              <!-- <div class="col-3">
                <small class="text-secondary">RARITY</small>
                <p class="text-light mb-0 fs-5" th:text="${card.rarity} ?: 'N/A'"></p>
              </div> -->
              <div class="col-3">
                <small class="text-secondary">#</small>
                <p class="text-light mb-0 fs-5" th:text="${card.collectorNumber} ?: 'N/A'"></p>
              </div>
            </div>
          </div>
        </div>
        <!-- Flavor Text -->
        <div class="mb-4" th:if="${card.flavorText != null and card.flavorText != ''}">
          <small class="text-secondary d-block mb-2">FLAVOR TEXT</small>
          <p class="text-secondary fst-italic" style="
                white-space: pre-wrap;
                line-height: 1.6;
                border-left: 3px solid rgba(255, 193, 7, 0.2);
                padding-left: 1rem;
                font-size: 0.95rem;
                " th:text="${card.flavorText}"></p>
        </div>

        <!-- Artista -->

        <small class="text-secondary d-block mb-2">ILLUSTRATED BY</small>
        <p class="text-light" style="font-size: 0.95rem" th:text="${#strings.listJoin(card.artistNames, ', ')}"></p>

        <!-- Legalità e formati -->
        <div class="mb-4" th:if="${card.legalities != null and !#maps.isEmpty(card.legalities)}">
          <small class="text-secondary d-block mb-3">LEGALITY</small>
          <div style="
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 0.75rem;
                ">
            <!-- th:with="status=${card.legalities.get('standard')}" -->
            <th:block th:each="format : ${card.legalities}">
              <div class="row px-2">
                <span th:text="${#strings.capitalize(format.key)}" class="col-md-12 format-label">Standard</span>
   
                <span th:if="${format.value == 'legal'}" class="col-md-5 badge legal">LEGAL</span>
                <span th:if="${format.value != 'legal'}" class="col-md-5 badge not-legal">NOT LEGAL</span>
              </div>

            </th:block>

          </div>
        </div>
        <hr class="border-warning mb-4" style="opacity: 0.3" />

        <!-- Bottone Torna -->
        <div class="mt-5">
          <a href="/cards" class="btn btn-outline-warning fw-bold">&larr; Back to Cards</a>
        </div>
      </div>
    </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <style>
    body {
      background: radial-gradient(60% 40% at 20% 10%,
          rgba(123, 31, 162, 0.15),
          transparent 60%),
        radial-gradient(50% 35% at 80% 20%,
          rgba(255, 193, 7, 0.08),
          transparent 60%),
        linear-gradient(180deg, #0b0f1a 0%, #1a1033 50%, #0b0f1a 100%);
      /* font-family: "Roboto", sans-serif; */
      min-height: 100vh;
    }

    small {
      font-size: 0.75rem !important;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .btn-outline-warning:hover {
      background-color: #ffc107;
      color: #000;
      transform: scale(1.05);
    }


    hr {
      opacity: 0.2;
    }

    .card-container {
      display: flex;
      align-items: center;
      justify-content: center;

    }

    .badge-legal,
    .badge-not-legal {
      width: 40%;
      text-align: center;
    }
  </style>
  <script src="/js/cardrotate.js" defer></script>
</body>

</html>
