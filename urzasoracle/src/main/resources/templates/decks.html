<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Decks')}"></head>

  <body class="bg-dark text-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container-fluid">
      <div class="row">
        <div class="col-12 pt-3 pb-2 deckinfo">
          <div class="row px-2">
            <div class="col-md-10">
              <div class="mb-5">
                <h1 class="fw-bold mb-0" style="font-size: 2.5rem">
                  <span id="pageTitle">Community Decks</span>
                </h1>

                <!-- ✅ TAB SWITCHER -->
                <div class="d-flex gap-3 mt-3">
                  <button
                    id="btnCommunity"
                    class="btn btn-warning fw-bold active"
                    onclick="switchTab('community')"
                  >
                    🌍 Community Decks
                  </button>
                  <button
                    id="btnMyDecks"
                    class="btn btn-outline-warning fw-bold"
                    onclick="switchTab('mydecks')"
                    th:if="${isLoggedIn}"
                  >
                    📚 My Decks
                  </button>
                </div>

                <!-- ✅ TASTO CREA DECK (solo in My Decks) -->
                <button
                  id="createDeckBtn"
                  class="btn btn-success fw-bold mt-3"
                  data-bs-toggle="modal"
                  data-bs-target="#createDeckModal"
                  style="display: none"
                  th:if="${isLoggedIn}"
                >
                  ➕ Nuovo Mazzo
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- GRID -->
      <div class="row px-4 justify-content-center">
        <div class="col-11 row deckholder">
          <!-- FILTRI -->
          <div class="col-12 py-3">
            <div class="row g-2 mb-4">
              <div class="col-md-4">
                <input
                  type="text"
                  class="form-control searchoptions border-warning"
                  id="searchCatalog"
                  placeholder="Search"
                />
              </div>
              <div class="col-md-2">
                <select
                  class="form-select searchoptions border-warning"
                  id="formatFilterCatalog"
                >
                  <option value="">Formats</option>
                  <option value="standard">Standard</option>
                  <option value="modern">Modern</option>
                  <option value="commander">Commander</option>
                  <option value="legacy">Legacy</option>
                </select>
              </div>
              <div class="col-md-2">
                <select
                  class="form-select searchoptions border-warning"
                  id="sortCatalog"
                >
                  <option value="name">Nome</option>
                  <option value="author">Autore</option>
                  <option value="cards">Carte</option>
                </select>
              </div>
              <div class="col-md-2">
                <button
                  class="btn btn-outline-warning w-100 fw-bold"
                  onclick="resetFiltersCatalog()"
                >
                  Reset
                </button>
              </div>
            </div>

            <div class="row">
              <div class="row" id="catalogContainer"></div>
            </div>

            <!-- EMPTY STATE -->
            <div id="emptyState" style="display: none" class="text-center py-5">
              <p class="text-secondary mb-3">Nessun mazzo trovato</p>
              <button
                class="btn btn-warning"
                data-bs-toggle="modal"
                data-bs-target="#createDeckModal"
                th:if="${isLoggedIn}"
              >
                ➕ Crea il tuo primo mazzo
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ✅ MODAL: CREA MAZZO -->
    <div class="modal fade" id="createDeckModal" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content bg-dark border-warning">
          <div class="modal-header border-warning">
            <h5 class="modal-title text-warning fw-bold">Crea Mazzo</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="createForm">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label text-warning fw-bold">Nome</label>
                <input
                  type="text"
                  class="form-control form-control-sm bg-secondary text-white border-warning"
                  id="newDeckName"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label text-warning fw-bold"
                  >Descrizione</label
                >
                <textarea
                  class="form-control form-control-sm bg-secondary text-white border-warning"
                  id="newDeckDesc"
                  rows="2"
                ></textarea>
              </div>
              <div class="mb-0">
                <label class="form-label text-warning fw-bold">Formato</label>
                <select
                  class="form-select form-select-sm bg-secondary text-white border-warning"
                  id="newDeckFormat"
                >
                  <option value="standard">Standard</option>
                  <option value="modern">Modern</option>
                  <option value="commander">Commander</option>
                  <option value="legacy">Legacy</option>
                </select>
              </div>
            </div>
            <div class="modal-footer border-warning">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Annulla
              </button>
              <button type="submit" class="btn btn-warning fw-bold">
                Crea
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:inline="javascript">
      const isLoggedIn = /*[[${isLoggedIn}]]*/ false;
      const activeTab = /*[[${active}]]*/ "decks";
      const csrfToken = /*[[${csrfToken}]]*/ "";
      const csrfHeader = /*[[${csrfHeader}]]*/ "X-CSRF-TOKEN";
      const initialDecks = /*[[${decks}]]*/ [];

      let allDecksFromCatalog = {
        community: [],
        mydecks: [],
      };

      if (activeTab === "mydecks") {
        allDecksFromCatalog.mydecks = initialDecks;
      } else {
        allDecksFromCatalog.community = initialDecks;
      }

      let currentTab = "community";

      window.addEventListener("load", async () => {
        if (isLoggedIn && allDecksFromCatalog.mydecks.length === 0) {
          try {
            const res = await fetch("/decks/api/mydecks");
            if (res.ok) {
              allDecksFromCatalog.mydecks = await res.json();
            }
          } catch (e) {
            console.error("Error loading mydecks:", e);
          }
        }

        if (activeTab === "mydecks") {
          switchTab("mydecks");
        } else {
          switchTab("community");
        }
      });

      function switchTab(tab) {
        currentTab = tab;

        document.getElementById("pageTitle").textContent =
          tab === "mydecks" ? "My Decks" : "Community Decks";

        document
          .getElementById("btnCommunity")
          .classList.toggle("active", tab === "community");
        document
          .getElementById("btnCommunity")
          .classList.toggle("btn-warning", tab === "community");
        document
          .getElementById("btnCommunity")
          .classList.toggle("btn-outline-warning", tab !== "community");

        const myDecksBtn = document.getElementById("btnMyDecks");
        if (myDecksBtn) {
          myDecksBtn.classList.toggle("active", tab === "mydecks");
          myDecksBtn.classList.toggle("btn-warning", tab === "mydecks");
          myDecksBtn.classList.toggle("btn-outline-warning", tab !== "mydecks");
        }

        const createBtn = document.getElementById("createDeckBtn");
        if (createBtn) {
          createBtn.style.display =
            tab === "mydecks" && isLoggedIn ? "block" : "none";
        }

        filterCatalog();
      }

      document
        .getElementById("searchCatalog")
        ?.addEventListener("input", filterCatalog);
      document
        .getElementById("formatFilterCatalog")
        ?.addEventListener("change", filterCatalog);
      document
        .getElementById("sortCatalog")
        ?.addEventListener("change", filterCatalog);

      function filterCatalog() {
        const search =
          document.getElementById("searchCatalog")?.value.toLowerCase() || "";
        const format =
          document.getElementById("formatFilterCatalog")?.value || "";
        const sort = document.getElementById("sortCatalog")?.value || "name";

        let decks = allDecksFromCatalog[currentTab] || [];

        let filtered = decks.filter((deck) => {
          const matchSearch =
            deck.name.toLowerCase().includes(search) ||
            (deck.owner && deck.owner.toLowerCase().includes(search));
          const matchFormat =
            !format ||
            deck.mainDeckFormat.toLowerCase() === format.toLowerCase();
          return matchSearch && matchFormat;
        });

        if (sort === "name")
          filtered.sort((a, b) => a.name.localeCompare(b.name));
        else if (sort === "author")
          filtered.sort((a, b) => (a.owner || "").localeCompare(b.owner || ""));
        else if (sort === "cards")
          filtered.sort((a, b) => (b.totalCards || 0) - (a.totalCards || 0));

        renderCatalog(filtered);
      }

      function renderCatalog(decks) {
        const container = document.getElementById("catalogContainer");
        const emptyState = document.getElementById("emptyState");

        if (!container) return;

        if (decks.length === 0) {
          container.innerHTML = "";
          emptyState.style.display = "block";
          return;
        }

        emptyState.style.display = "none";

        container.innerHTML = decks
          .map((deck) => {
            const previewImg =
              deck.previewimg ||
              "https://cards.scryfall.io/art_crop/front/b/8/b8dd4693-424d-4d6e-86cf-24401a23d6b1.jpg?1721425770";

            return `
          <div class="col-sm-3 pt-3 px-2">
            <a href="/decks/public/${deck.id}" class="link-unstyled">
              <div class="card-deck" style="background-image:linear-gradient(rgba(0, 0, 0, 0.8)),url(${previewImg}); background-repeat: no-repeat, repeat; background-size: cover; background-origin: border-box;">
                <div class="info">
                  <h5 class="title">${deck.name}</h5>
                  <p class="author">by ${deck.owner || "Unknown"}, for ${
              deck.mainDeckFormat
            }</p>
                  <p class="desc">${deck.description || ""}</p>
                </div>
              </div>
            </a>
          </div>
        `;
          })
          .join("");
      }

      function resetFiltersCatalog() {
        document.getElementById("searchCatalog").value = "";
        document.getElementById("formatFilterCatalog").value = "";
        document.getElementById("sortCatalog").value = "name";
        filterCatalog();
      }

      document
        .getElementById("createForm")
        ?.addEventListener("submit", async function (e) {
          e.preventDefault();
          const res = await fetch("/decks/create", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              [csrfHeader]: csrfToken,
            },
            body: new URLSearchParams({
              name: document.getElementById("newDeckName").value,
              description: document.getElementById("newDeckDesc").value,
              mainDeckFormat: document.getElementById("newDeckFormat").value,
            }),
          });
          if (res.ok) {
            const newDeck = await res.json();
            allDecksFromCatalog.mydecks.push(newDeck);
            switchTab("mydecks");
            bootstrap.Modal.getInstance(
              document.getElementById("createDeckModal")
            )?.hide();
            document.getElementById("createForm").reset();
          }
        });
    </script>
  </body>
</html>
