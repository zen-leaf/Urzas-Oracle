<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Catalogo Mazzi')}">
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body class="bg-dark text-light">
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container-fluid">
    <div class="row">
      <div class="col-12 pt-3 pb-2 deckinfo">

        <div class="row px-2">
          <div class="col-md-10">
            <div class="mb-5">
              <h1 class="fw-bold mb-0" style="font-size: 2.5rem">
                Community decks </h1>
              <a th:if="${isLoggedIn}" th:href="@{/decks/mydecks}" class="btn btn-warning fw-bold mt-3">My decks</a>
              <!-- <a th:unless="${isLoggedIn}" th:href="@{/login}" class="btn btn-warning fw-bold mt-3">Log in to view your decks</a> -->
            </div>


          </div>
        </div>
      </div>
    </div>
    <!-- GRID -->
    <div class="row px-4 justify-content-center" th:if="${not #lists.isEmpty(decks)}">

      <div class="col-11 row deckholder ">
        <!-- FILTRI -->
        <div class="col-12 py-3">
          <div class="row g-2 mb-4 ">
            <div class="col-md-4">
              <input type="text" class="form-control searchoptions border-warning" id="searchCatalog"
                placeholder="Search" />
            </div>
            <div class="col-md-2">
              <select class="form-select searchoptions border-warning" id="formatFilterCatalog">
                <option value="">Formats</option>
                <option value="standard">Standard</option>
                <option value="modern">Modern</option>
                <option value="commander">Commander</option>
                <option value="legacy">Legacy</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select searchoptions border-warning" id="sortCatalog">
                <option value="name">Nome</option>
                <option value="author">Autore</option>
                <option value="cards">Carte</option>
              </select>
            </div>
            <div class="col-md-2">
              <button class="btn btn-outline-warning w-100 fw-bold" onclick="resetFiltersCatalog()">
                Reset
              </button>
            </div>
          </div>
          <div class="row ">
            <th:block th:each="deck : ${decks}">
              <div class="col-sm-3 pt-3 px-2">
                <a th:href="@{'/decks/public/'+${deck.id}}" class="link-unstyled">
                  <div class="card-deck"
                    th:style="'background-image:linear-gradient(rgba(0, 0, 0, 0.8)),url(' + @{https://cards.scryfall.io/art_crop/front/b/8/b8dd4693-424d-4d6e-86cf-24401a23d6b1.jpg?1721425770} + '); background-repeat: no-repeat, repeat; background-size: cover;background-origin: border-box;'">
                    <div class="info">
                      <h5 th:text="${deck.name}" class="title"></h5>
                      <p th:text="'by '+${deck.owner}+', for '+${deck.mainDeckFormat}" class="author"></p>

                      <p th:text="${deck.description}" class="desc"></p>
                    </div>
                  </div>
                </a>
              </div>
            </th:block>
          </div>
        </div>
      </div>

    </div>

    <div th:if="${#lists.isEmpty(decks)}" class="text-center py-5">
      <p class="text-secondary">Nessun mazzo disponibile</p>
    </div>
    </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <style>
    body {
      background: linear-gradient(180deg, #0a0e17 0%, #151a2b 100%);
      font-family: "Segoe UI", sans-serif;
    }

    .wrapper {
      background: radial-gradient(60% 40% at 20% 10%,
          rgba(123, 31, 162, 0.12),
          transparent 60%),
        radial-gradient(50% 35% at 80% 20%,
          rgba(255, 193, 7, 0.08),
          transparent 60%),
        rgba(0, 0, 0, 0.2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .content {
      width: 100%;
      max-width: 1400px;
      background: rgba(10, 10, 20, 0.7);
      border: 1px solid rgba(255, 193, 7, 0.2);
      border-radius: 15px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }



    .card-deck:hover {
      border-color: #ffc107;
      box-shadow: 0 15px 40px rgba(255, 193, 7, 0.15);
      transform: translateY(-4px);
    }

    .preview {
      height: 130px;
      background: rgba(5, 5, 15, 0.9);
      position: relative;
      overflow: hidden;
      padding: 10px;
      display: flex;
      align-items: center;
    }

    .cards {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .cards img {
      position: absolute;
      width: 60px;
      height: 85px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid rgba(255, 193, 7, 0.2);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    .empty {
      color: #666;
      font-size: 0.9rem;
      margin: auto;
    }



    .title {
      color: #ffc107;
      font-weight: 700;
      margin-bottom: 4px;
      font-size: 1.05rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .author {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.75rem;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .desc {
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.8rem;
      margin-bottom: 10px;
      flex: 1;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .stats {
      display: flex;
      gap: 6px;
    }



    .link-unstyled {
      text-decoration: none;
      color: inherit;
    }
  </style>

  <script th:inline="javascript">
    let allDecksFromCatalog = /*[[${decks}]]*/[];

    document
      .getElementById("searchCatalog")
      ?.addEventListener("input", filterCatalog);
    document
      .getElementById("formatFilterCatalog")
      ?.addEventListener("change", filterCatalog);
    document
      .getElementById("sortCatalog")
      ?.addEventListener("change", filterCatalog);

    function filterCatalog() {
      const search =
        document.getElementById("searchCatalog")?.value.toLowerCase() || "";
      const format =
        document.getElementById("formatFilterCatalog")?.value || "";
      const sort = document.getElementById("sortCatalog")?.value || "name";

      let filtered = allDecksFromCatalog.filter((deck) => {
        const matchSearch =
          deck.name.toLowerCase().includes(search) ||
          deck.owner.toLowerCase().includes(search);
        const matchFormat =
          !format ||
          deck.mainDeckFormat.toLowerCase() === format.toLowerCase();
        return matchSearch && matchFormat;
      });

      if (sort === "name")
        filtered.sort((a, b) => a.name.localeCompare(b.name));
      else if (sort === "author")
        filtered.sort((a, b) => a.owner.localeCompare(b.owner));
      else if (sort === "cards")
        filtered.sort((a, b) => b.totalCards - a.totalCards);

      renderCatalog(filtered);
    }

    function renderCatalog(decks) {
      const container = document.getElementById("catalogContainer");
      //       <div class="preview">
      //   <div class="deckBanner">${cardsHtml}</div>
      // </div>
      container.innerHTML = decks
        .map((deck) => {
          cardsHtml = `<img src="${deck.previewimg}" alt="${deck.name}" />`


          return `
          <div class="col-sm-3 pt-3 px-2">
            <a href="/decks/public/${deck.id}" class="link-unstyled">
              <div class="card-deck">
                <div class="info" th:style="'background-image:url(' + @{deck.previewimg} + '); background-repeat: no-repeat, repeat; background-size: cover;'">
                  <h5 class="title">${deck.name}</h5>
                  <p class="author">by ${deck.owner}, for ${deck.mainDeckFormat}</p>
              
                  <p class="desc">${deck.description || ""}</p>
                </div>
              </div>
            </a>
          </div>
        `;
        })
        .join("");
    }

    function resetFiltersCatalog() {
      document.getElementById("searchCatalog").value = "";
      document.getElementById("formatFilterCatalog").value = "";
      document.getElementById("sortCatalog").value = "name";
      filterCatalog();
    }

    window.addEventListener("load", () => {
      allDecksFromCatalog = /*[[${decks}]]*/[];
      filterCatalog();
    });
  </script>
</body>

</html>
