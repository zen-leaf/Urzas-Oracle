<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('Decks')}"></head>
  <body class="bg-dark text-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container-fluid">
      <div class="row">
        <div class="col-12 pt-3 pb-2 deckinfo">
          <div class="row px-2">
            <div class="col-md-10">
              <div class="mb-5">
                <h1 class="fw-bold mb-0" style="font-size: 2.5rem">
                  <span id="pageTitle">Community Decks</span>
                </h1>

                <!-- ✅ TAB SWITCHER -->
                <div class="d-flex gap-3 mt-3">
                  <button
                    id="btnCommunity"
                    class="btn btn-warning fw-bold active"
                    onclick="switchTab('community')"
                  >
                    🌍 Community Decks
                  </button>
                  <button
                    id="btnMyDecks"
                    class="btn btn-outline-warning fw-bold"
                    onclick="switchTab('mydecks')"
                    th:if="${isLoggedIn}"
                  >
                    📚 My Decks
                  </button>
                </div>

                <!-- ✅ TASTO CREA DECK -->
                <button
                  id="createDeckBtn"
                  class="btn btn-success fw-bold mt-3"
                  data-bs-toggle="modal"
                  data-bs-target="#createDeckModal"
                  style="display: none"
                  th:if="${isLoggedIn}"
                >
                  ➕ Nuovo Mazzo
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- GRID -->
      <div class="row px-4 justify-content-center">
        <div class="col-11 row deckholder">
          <!-- ✅ FILTRI -->
          <div class="col-12 py-3">
            <div class="row g-2 mb-4">
              <div class="col-md-4">
                <input
                  type="text"
                  class="form-control searchoptions border-warning"
                  id="searchDeck"
                  placeholder="🔍 Cerca..."
                />
              </div>
              <div class="col-md-2">
                <select
                  class="form-select searchoptions border-warning"
                  id="formatFilter"
                >
                  <option value="">Tutti i formati</option>
                  <option value="standard">Standard</option>
                  <option value="modern">Modern</option>
                  <option value="commander">Commander</option>
                  <option value="legacy">Legacy</option>
                </select>
              </div>
              <div class="col-md-2">
                <select
                  class="form-select searchoptions border-warning"
                  id="sortDeck"
                >
                  <option value="name">Nome</option>
                  <option value="cards">Carte</option>
                </select>
              </div>
              <div class="col-md-2">
                <button
                  class="btn btn-outline-warning w-100 fw-bold"
                  onclick="resetFilters()"
                >
                  Reset
                </button>
              </div>
            </div>

            <!-- ✅ GRIGLIA MAZZI -->
            <div class="row" id="decksContainer"></div>

            <!-- ✅ EMPTY STATE -->
            <div id="emptyState" style="display: none" class="text-center py-5">
              <p class="text-secondary mb-3">Nessun mazzo trovato</p>
              <button
                class="btn btn-warning"
                data-bs-toggle="modal"
                data-bs-target="#createDeckModal"
                th:if="${isLoggedIn}"
              >
                ➕ Crea il tuo primo mazzo
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ✅ MODAL: CREA MAZZO -->
    <div class="modal fade" id="createDeckModal" tabindex="-1">
      <div class="modal-dialog modal-sm">
        <div class="modal-content bg-dark border-warning">
          <div class="modal-header border-warning">
            <h5 class="modal-title text-warning fw-bold">Crea Mazzo</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="createForm">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label text-warning fw-bold">Nome</label>
                <input
                  type="text"
                  class="form-control form-control-sm bg-secondary text-white border-warning"
                  id="newDeckName"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label text-warning fw-bold"
                  >Descrizione</label
                >
                <textarea
                  class="form-control form-control-sm bg-secondary text-white border-warning"
                  id="newDeckDesc"
                  rows="2"
                ></textarea>
              </div>
              <div class="mb-0">
                <label class="form-label text-warning fw-bold">Formato</label>
                <select
                  class="form-select form-select-sm bg-secondary text-white border-warning"
                  id="newDeckFormat"
                >
                  <option value="standard">Standard</option>
                  <option value="modern">Modern</option>
                  <option value="commander">Commander</option>
                  <option value="legacy">Legacy</option>
                </select>
              </div>
            </div>
            <div class="modal-footer border-warning">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Annulla
              </button>
              <button type="submit" class="btn btn-warning fw-bold">
                Crea
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <style>
      body {
        background: linear-gradient(180deg, #0a0e17 0%, #151a2b 100%);
        font-family: "Segoe UI", sans-serif;
      }

      .deckinfo {
        background: rgba(10, 10, 20, 0.7);
        border-bottom: 1px solid rgba(255, 193, 7, 0.2);
      }

      .deckholder {
        background: rgba(10, 10, 20, 0.5);
        border-radius: 12px;
        padding: 20px;
      }

      .searchoptions {
        background-color: rgba(14, 4, 58, 0.164);
        color: var(--bs-secondary-color, #ffc107);
      }

      .searchoptions:focus {
        background-color: #2a2f3a !important;
        color: var(--bs-secondary-color, #ffc107);
        border-color: #ffc107 !important;
        box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
      }

      .card-deck {
        background: rgba(15, 15, 30, 0.9);
        border: 1px solid rgba(255, 193, 7, 0.2);
        border-radius: 12px;
        overflow: hidden;
        transition: all 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
      }

      .card-deck:hover {
        border-color: #ffc107;
        box-shadow: 0 15px 40px rgba(255, 193, 7, 0.15);
        transform: translateY(-4px);
      }

      .info {
        padding: 0.75rem 1rem 0.25rem 1rem;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .title {
        color: #ffc107;
        font-weight: 700;
        margin-bottom: 4px;
        font-size: 1.05rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .author {
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.75rem;
        margin-bottom: 6px;
        font-weight: 600;
      }

      .desc {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.8rem;
        margin-bottom: 10px;
        flex: 1;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .stats {
        display: flex;
        gap: 6px;
      }

      .btn-tab {
        transition: all 0.3s ease;
      }

      .btn-tab.active {
        background: #ffc107 !important;
        color: #000 !important;
        border-color: #ffc107 !important;
      }

      .link-unstyled {
        text-decoration: none;
        color: inherit;
      }
    </style>

    <script th:inline="javascript">
      const isLoggedIn = /*[[${isLoggedIn}]]*/ false;
      const activeTab = /*[[${active}]]*/ "decks";
      const csrfToken = /*[[${csrfToken}]]*/ "";
      const csrfHeader = /*[[${csrfHeader}]]*/ "X-CSRF-TOKEN";
      const initialDecks = /*[[${decks}]]*/ [];

      console.log("🔍 DEBUG INFO:");
      console.log("isLoggedIn:", isLoggedIn);
      console.log("activeTab:", activeTab);
      console.log("initialDecks:", initialDecks);

      if (initialDecks.length > 0) {
        console.log("First deck:", initialDecks[0]);
        console.log("previewCards:", initialDecks[0].previewCards);
      }

      let allDecks = {
        community: [],
        mydecks: [],
      };

      if (activeTab === "mydecks") {
        allDecks.mydecks = initialDecks;
      } else {
        allDecks.community = initialDecks;
      }

      let currentTab = "community";

      window.addEventListener("load", async () => {
        if (isLoggedIn && allDecks.mydecks.length === 0) {
          try {
            const res = await fetch("/decks/api/mydecks");
            if (res.ok) {
              allDecks.mydecks = await res.json();
            }
          } catch (e) {
            console.error("Error loading mydecks:", e);
          }
        }

        if (activeTab === "mydecks") {
          switchTab("mydecks");
        } else {
          switchTab("community");
        }
      });

      function switchTab(tab) {
        currentTab = tab;

        document.getElementById("pageTitle").textContent =
          tab === "mydecks" ? "My Decks" : "Community Decks";

        document
          .getElementById("btnCommunity")
          .classList.toggle("active", tab === "community");
        document
          .getElementById("btnCommunity")
          .classList.toggle("btn-warning", tab === "community");
        document
          .getElementById("btnCommunity")
          .classList.toggle("btn-outline-warning", tab !== "community");

        const myDecksBtn = document.getElementById("btnMyDecks");
        if (myDecksBtn) {
          myDecksBtn.classList.toggle("active", tab === "mydecks");
          myDecksBtn.classList.toggle("btn-warning", tab === "mydecks");
          myDecksBtn.classList.toggle("btn-outline-warning", tab !== "mydecks");
        }

        const createBtn = document.getElementById("createDeckBtn");
        if (createBtn) {
          createBtn.style.display =
            tab === "mydecks" && isLoggedIn ? "block" : "none";
        }

        filterDecks();
      }

      function filterDecks() {
        const search =
          document.getElementById("searchDeck")?.value.toLowerCase() || "";
        const format = document.getElementById("formatFilter")?.value || "";
        const sort = document.getElementById("sortDeck")?.value || "name";

        let decks = allDecks[currentTab] || [];

        let filtered = decks.filter((deck) => {
          const matchSearch =
            deck.name.toLowerCase().includes(search) ||
            (deck.owner && deck.owner.toLowerCase().includes(search));
          const matchFormat =
            !format ||
            deck.mainDeckFormat.toLowerCase() === format.toLowerCase();
          return matchSearch && matchFormat;
        });

        if (sort === "name")
          filtered.sort((a, b) => a.name.localeCompare(b.name));
        else if (sort === "cards")
          filtered.sort((a, b) => b.totalCards - a.totalCards);

        renderDecks(filtered);
      }

      function renderDecks(decks) {
        const container = document.getElementById("decksContainer");
        const emptyState = document.getElementById("emptyState");

        if (!container) return;

        if (decks.length === 0) {
          container.style.display = "none";
          emptyState.style.display = "block";
          return;
        }

        container.style.display = "flex";
        emptyState.style.display = "none";

        container.innerHTML = decks
          .map((deck) => {
            console.log(
              "Rendering deck:",
              deck.name,
              "previewCards:",
              deck.previewCards
            );

            // ✅ Usa previewimg se esiste, altrimenti fallback
            let previewHtml = "";
            if (deck.previewimg) {
              previewHtml = `<img src="${deck.previewimg}" alt="${deck.name}" style="width:100%; height:100%; object-fit:cover;" />`;
            } else if (deck.previewCards && deck.previewCards.length > 0) {
              previewHtml = deck.previewCards
                .slice(0, 4)
                .map((card, idx) => {
                  const imgUrl = card.imageUrl || card.imageurl || "";
                  return `<img src="${imgUrl}" alt="Card" style="position:absolute; left:${
                    idx * 30
                  }px; width:60px; height:85px; object-fit:cover; border-radius:4px; border:1px solid rgba(255,193,7,0.2); box-shadow:0 2px 6px rgba(0,0,0,0.5);" onerror="this.style.display='none'" />`;
                })
                .join("");
            } else {
              previewHtml =
                '<div style="color:#666; font-size:0.9rem; margin:auto;">Nessuna carta</div>';
            }

            return `
            <div class="col-sm-3 pt-3 px-2">
              <a href="/decks/public/${deck.id}" class="link-unstyled">
                <div class="card-deck">
                  <div class="info">
                    <h5 class="title">${deck.name}</h5>
                    <p class="author">by ${deck.owner || "Unknown"}, for ${
              deck.mainDeckFormat
            }</p>
                    <p class="desc">${deck.description || ""}</p>
                    <div class="stats">
                      <span class="badge bg-warning text-dark">${
                        deck.totalCards
                      }/100</span>
                      <span class="badge bg-info text-dark">${
                        deck.mainDeckFormat
                      }</span>
                    </div>
                  </div>
                </div>
              </a>
            </div>
          `;
          })
          .join("");
      }

      function resetFilters() {
        document.getElementById("searchDeck").value = "";
        document.getElementById("formatFilter").value = "";
        document.getElementById("sortDeck").value = "name";
        filterDecks();
      }

      document
        .getElementById("searchDeck")
        ?.addEventListener("input", filterDecks);
      document
        .getElementById("formatFilter")
        ?.addEventListener("change", filterDecks);
      document
        .getElementById("sortDeck")
        ?.addEventListener("change", filterDecks);

      document
        .getElementById("createForm")
        ?.addEventListener("submit", async function (e) {
          e.preventDefault();
          const res = await fetch("/decks/create", {
            method: "POST",
            headers: {
              "Content-Type": "application/x-www-form-urlencoded",
              [csrfHeader]: csrfToken,
            },
            body: new URLSearchParams({
              name: document.getElementById("newDeckName").value,
              description: document.getElementById("newDeckDesc").value,
              mainDeckFormat: document.getElementById("newDeckFormat").value,
            }),
          });
          if (res.ok) {
            const newDeck = await res.json();
            allDecks.mydecks.push(newDeck);
            switchTab("mydecks");
            bootstrap.Modal.getInstance(
              document.getElementById("createDeckModal")
            )?.hide();
            document.getElementById("createForm").reset();
          }
        });
    </script>
  </body>
</html>
