<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/head :: head('I Tuoi Mazzi')}">
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
  </head>
  <body class="bg-dark text-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5" style="max-width: 1400px">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="display-6 fw-bold text-white">I Tuoi Mazzi</h1>
        <button
          class="btn btn-warning btn-lg"
          data-bs-toggle="modal"
          data-bs-target="#createDeckModal"
        >
          + Crea Nuovo Mazzo
        </button>
      </div>

      <!-- NESSUN MAZZO -->
      <div
        th:if="${decks == null or #lists.isEmpty(decks)}"
        class="text-center py-5"
      >
        <div class="mb-4">
          <svg
            width="120"
            height="120"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="text-warning mx-auto"
          >
            <rect
              x="20"
              y="30"
              width="80"
              height="60"
              rx="8"
              stroke-dasharray="4 4"
            />
          </svg>
        </div>
        <h3 class="text-secondary mb-3">Nessun mazzo creato</h3>
        <p class="text-secondary mb-4">Inizia a costruire il tuo primo deck!</p>
        <button
          class="btn btn-warning"
          data-bs-toggle="modal"
          data-bs-target="#createDeckModal"
        >
          Crea il tuo primo mazzo
        </button>
      </div>

      <!-- GRIGLIA MAZZI CLICCABILI -->
      <div
        class="row g-4"
        th:if="${decks != null and not #lists.isEmpty(decks)}"
      >
        <div class="col-md-6 col-lg-4" th:each="deck : ${decks}">
          <a th:href="@{/decks/{id}(id=${deck.id})}" class="deck-card-link">
            <div class="deck-card">
              <!-- PREVIEW CARTE (FORMATO CORRETTO) -->
              <div class="deck-preview">
                <div
                  class="preview-grid"
                  th:if="${deck.previewCards != null and not #lists.isEmpty(deck.previewCards)}"
                >
                  <div
                    class="preview-card"
                    th:each="card, iterStat : ${deck.previewCards}"
                    th:if="${iterStat.index < 4}"
                  >
                    <img
                      th:if="${card.imageUrl != null}"
                      th:src="${card.imageUrl}"
                      th:alt="${card.cardName}"
                    />
                    <div th:if="${card.imageUrl == null}" class="no-preview">
                      🃏
                    </div>
                  </div>
                </div>
                <div
                  th:if="${deck.previewCards == null or #lists.isEmpty(deck.previewCards)}"
                  class="empty-preview"
                >
                  <span class="text-secondary">Nessuna carta</span>
                </div>
              </div>

              <!-- INFO MAZZO -->
              <div class="deck-info">
                <h5 class="deck-name" th:text="${deck.name}"></h5>
                <p class="deck-description" th:text="${deck.description}"></p>

                <div class="deck-stats">
                  <span class="badge bg-dark border border-warning">
                    <span th:text="${deck.totalCards}"></span> / 100 carte
                  </span>
                  <span
                    class="badge bg-info text-dark"
                    th:text="${deck.mainDeckFormat}"
                  ></span>
                </div>
              </div>
            </div>
          </a>
        </div>
      </div>
    </main>

    <!-- MODAL: CREA MAZZO -->
    <div class="modal fade" id="createDeckModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content bg-dark border-warning">
          <div class="modal-header border-warning">
            <h5 class="modal-title text-warning">Crea Nuovo Mazzo</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="createForm">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label text-warning">Nome Mazzo</label>
                <input
                  type="text"
                  class="form-control bg-secondary text-white border-warning"
                  id="newDeckName"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label text-warning">Descrizione</label>
                <textarea
                  class="form-control bg-secondary text-white border-warning"
                  id="newDeckDesc"
                  rows="3"
                ></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label text-warning">Formato</label>
                <select
                  class="form-select bg-secondary text-white border-warning"
                  id="newDeckFormat"
                >
                  <option value="standard">Standard</option>
                  <option value="modern">Modern</option>
                  <option value="commander">Commander</option>
                  <option value="legacy">Legacy</option>
                </select>
              </div>
            </div>
            <div class="modal-footer border-warning">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Annulla
              </button>
              <button type="submit" class="btn btn-warning">Crea Mazzo</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <style>
      body {
        background: radial-gradient(
            circle at 20% 20%,
            rgba(123, 31, 162, 0.12),
            transparent 50%
          ),
          radial-gradient(
            circle at 80% 80%,
            rgba(255, 193, 7, 0.08),
            transparent 50%
          ),
          linear-gradient(180deg, #0a0e17 0%, #151a2b 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      }

      .deck-card-link {
        text-decoration: none;
        display: block;
        height: 100%;
      }

      .deck-card {
        background: rgba(15, 15, 30, 0.6);
        border: 2px solid rgba(255, 193, 7, 0.2);
        border-radius: 12px;
        overflow: hidden;
        transition: all 0.3s ease;
        cursor: pointer;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      .deck-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 40px rgba(255, 193, 7, 0.3);
        border-color: #ffc107;
      }

      .deck-preview {
        height: 220px;
        background: rgba(10, 10, 20, 0.8);
        overflow: hidden;
        position: relative;
      }

      .preview-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
        height: 100%;
        gap: 4px;
        padding: 8px;
      }

      .preview-card {
        border-radius: 6px;
        overflow: hidden;
        background: rgba(26, 16, 51, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .preview-card img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* ✅ MANTIENE ASPECT RATIO */
      }

      .no-preview {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: #555;
      }

      .empty-preview {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
      }

      .deck-info {
        padding: 20px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .deck-name {
        color: #ffc107;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 1.3rem;
      }

      .deck-description {
        color: rgba(255, 255, 255, 0.7);
        font-size: 0.9rem;
        margin-bottom: 12px;
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }

      .deck-stats {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .form-control:focus,
      .form-select:focus {
        background-color: #2a2f3a !important;
        color: #fff !important;
        border-color: #ffc107 !important;
        box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
      }
    </style>

    <script th:inline="javascript">
      const csrfToken = /*[[${_csrf.token}]]*/ "";
      const csrfHeader = /*[[${_csrf.headerName}]]*/ "X-CSRF-TOKEN";

      document
        .getElementById("createForm")
        ?.addEventListener("submit", async function (e) {
          e.preventDefault();

          const name = document.getElementById("newDeckName").value;
          const description = document.getElementById("newDeckDesc").value;
          const format = document.getElementById("newDeckFormat").value;

          try {
            const res = await fetch("/decks/create", {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                [csrfHeader]: csrfToken,
              },
              body: new URLSearchParams({
                name,
                description,
                mainDeckFormat: format,
              }),
            });

            if (res.ok) {
              location.reload();
            } else {
              alert("Errore nella creazione del mazzo");
            }
          } catch (e) {
            console.error(e);
            alert("Errore di rete");
          }
        });
    </script>
  </body>
</html>
