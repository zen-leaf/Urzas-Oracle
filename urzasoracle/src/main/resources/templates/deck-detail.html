<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Dettagli Mazzo')}">
  <meta name="_csrf" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>

<body class="bg-dark text-light">
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container-fluid" style="min-height: 100vh;">
    <div class="row ">
      <div class="col-12 pt-3 pb-2 deckinfo">

        <div class="row px-2">
          <div class="col-md-10">
            <h1 class="deck-title d-inline" th:text="${deck.name}"></h1>
            <p th:if="${isOwner}" class="fw-bold d-inline" data-bs-toggle="modal" data-bs-target="#editDeckModal">
              ✏️
            </p>
            <p class="deck-desc" th:text="${deck.description}"></p>
          </div>
          <div class="col-md-2">
            <div class="meta">
              <span class="badge bg-warning text-dark fw-bold" th:text="${totalCards} + ' / 100'"></span>
              <span class="badge bg-info text-dark fw-bold" th:text="${deck.mainDeckFormat}"></span>
              <span class="badge bg-secondary fw-bold">by: <strong th:text="${deck.owner}"></strong></span>
            </div>

          </div>



          <button th:if="${isLoggedIn and not isOwner}" class="btn btn-success fw-bold" onclick="cloneDeck()">
            📋 Copia
          </button>

          <div class="progress-bar bg-warning" th:style="'width: ' + ${(totalCards/100)*100} + '%'"></div>

        </div>
      </div>

      <!-- Immagine Carta -->
    </div>
    <div class="row">
      <div class="col-sm-5 col-md-5 col-lg-3 py-5 d-none d-md-block">
        <div class="card-container" style="    aspect-ratio:  0.714;">
          <div id="dragCard" class="magic-card" sty>
            <div class="card-face card-front">
              <img th:if="${card.images != null and card.images['large'] != null}" th:src="${card.images['large']}"
                th:alt="${card.name}" class=" shadow card-img" />
            </div>
            <div class="card-face card-back">

              <img th:if="${card.backFace != null and card.backFace.images['large'] != null}"
                th:src="${card.backFace.images['large']}" th:alt="${card.name}" class="shadow card-img" />

            </div>
          </div>
        </div>
        <div th:if="${card.images == null or card.images['large'] == null}"
          class="w-100  d-flex align-items-center justify-content-center text-secondary" style="
              aspect-ratio: 488/680;
              background: rgba(108, 117, 125, 0.2);
              border: 2px dashed rgba(255, 193, 7, 0.2);
              ">
          <span>No Image</span>
        </div>
      </div>
      <div class="col-md-8 col-lg-8 py-3 deckholder">
        <!-- LAYOUT MOXFIELD: COLONNE MULTIPLE -->
        <div class="mb-3 d-flex justify-content-between align-items-center">
          <h5 class="text-white mb-0">Decklist</h5>
          <div class="d-flex gap-2 align-items-center">
            <select class="form-select form-select-sm bg-secondary text-white border-warning" id="sortBy"
              style="width: 200px">
              <option value="name">Sort by name</option>
              <option value="quantity">Sort by quantity</option>
              <option value="type">Sort by type</option>
            </select>
            <button class="btn btn-warning btn-sm px-4" data-bs-toggle="modal" data-bs-target="#addCardModal"
              th:if="${isOwner}">
              Add cards
            </button>
          </div>
        </div>

        <!-- NESSUNA CARTA -->
        <div id="emptyState" th:if="${cards == null or #lists.isEmpty(cards)}"
          class="text-center py-5 border border-secondary rounded bg-dark">
          <p class="text-secondary mb-3">Nessuna carta nel deck</p>
          <button class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#addCardModal" th:if="${isOwner}">
            Aggiungi Carte
          </button>
        </div>


        <!-- LAYOUT MOXFIELD: GRID MULTICOLONNA -->
        <div th:if="${not #lists.isEmpty(cards)}" class="cardcolumns" id="deckGridContainer">
          <!-- Categorie renderizzate con JS -->

        </div>
      </div>
  </main>

  <!-- PREVIEW HOVER CARTA (SEGUE CURSORE) -->
  <div id="cardPreview" class="card-preview">
    <img id="cardPreviewImg" src="" alt="Card Preview" />
  </div>

  <!-- MENU CONTESTUALE -->
  <div id="contextMenu" class="context-menu">
    <div class="context-item" onclick="contextViewCard()">
      <span>👁️</span> Visualizza Dettagli
    </div>
    <div class="context-item" onclick="contextAddCard()" th:if="${isOwner}">
      <span>➕</span> Aggiungi Copia
    </div>
    <div class="context-item" onclick="contextRemoveCard()" th:if="${isOwner}">
      <span>➖</span> Rimuovi Copia
    </div>
    <div class="context-divider" th:if="${isOwner}"></div>
    <div class="context-item context-danger" onclick="contextDeleteCard()" th:if="${isOwner}">
      <span>🗑️</span> Rimuovi Completamente
    </div>
  </div>

  <!-- MODAL: AGGIUNGI CARTE (CON PAGINAZIONE + FILTRO LEGALITÀ) -->
  <div class="modal fade" id="addCardModal" tabindex="-1">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content bg-dark">
        <div class="modal-header border-secondary">
          <h5 class="modal-title text-white">Aggiungi Carte al Deck</h5>
          <div class="d-flex gap-3 align-items-center">
            <span id="deckStatus" class="badge bg-dark border border-warning fs-6 px-3 py-2">
              <span id="currentTotal" th:text="${totalCards}"></span> / 100
            </span>
            <button type="button" class="btn btn-success px-4" onclick="saveSelectedCards()" id="saveBtn">
              💾 Salva
            </button>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
        </div>
        <div class="modal-body p-4">
          <div class="mx-auto" style="max-width: 1600px">
            <!-- FILTRI -->
            <div class="row g-3 mb-4">
              <div class="col-md-3">
                <input type="text" class="form-control bg-secondary text-white border-warning" id="searchInput"
                  placeholder="🔍 Cerca per nome..." />
              </div>
              <div class="col-md-2">
                <select class="form-select bg-secondary text-white border-warning" id="typeFilter">
                  <option value="">Tutti i tipi</option>
                  <option value="Creature">Creature</option>
                  <option value="Instant">Instant</option>
                  <option value="Sorcery">Sorcery</option>
                  <option value="Enchantment">Enchantment</option>
                  <option value="Artifact">Artifact</option>
                  <option value="Land">Land</option>
                  <option value="Planeswalker">Planeswalker</option>
                </select>
              </div>
              <div class="col-md-2">
                <select class="form-select bg-secondary text-white border-warning" id="colorFilter">
                  <option value="">Tutti i colori</option>
                  <option value="W">⚪ Bianco</option>
                  <option value="U">🔵 Blu</option>
                  <option value="B">⚫ Nero</option>
                  <option value="R">🔴 Rosso</option>
                  <option value="G">🟢 Verde</option>
                  <option value="C">◯ Incolore</option>
                </select>
              </div>
              <div class="col-md-3">
                <select class="form-select bg-secondary text-white border-warning" id="legalityFilter">
                  <option value="">Tutte le legalità</option>
                  <option value="legal">✅ Solo legali</option>
                  <option value="not_legal">❌ Solo non legali</option>
                </select>
              </div>
              <div class="col-md-2">
                <button class="btn btn-outline-warning w-100" onclick="clearFilters()">
                  Reset
                </button>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="text-warning">
                <small>📊 <span id="resultCount">0</span> risultati | 💡 Click: +1
                  | Destro: -1</small>
              </div>
              <div class="d-flex gap-2 align-items-center">
                <button class="btn btn-sm btn-outline-warning" onclick="prevPage()" id="prevBtn">
                  ← Precedente
                </button>
                <span class="text-white">Pagina <span id="currentPage">1</span> di
                  <span id="totalPages">1</span></span>
                <button class="btn btn-sm btn-outline-warning" onclick="nextPage()" id="nextBtn">
                  Successiva →
                </button>
              </div>
            </div>

            <!-- GRIGLIA CARTE PAGINATA -->
            <div class="row g-3 custom-scrollbar justify-content-center" id="cardGrid"
              style="max-height: calc(100vh - 320px); overflow-y: auto">
              <p class="text-center text-secondary col-12">
                ⏳ Caricamento...
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: MODIFICA -->
  <div class="modal fade" id="editDeckModal" tabindex="-1" th:if="${isOwner}">
    <div class="modal-dialog">
      <div class="modal-content bg-dark border-warning">
        <div class="modal-header border-warning">
          <h5 class="modal-title text-warning">Modifica Mazzo</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="editForm">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label text-warning">Nome</label>
              <input type="text" class="form-control bg-secondary text-white border-warning" id="deckName"
                th:value="${deck.name}" />
            </div>
            <div class="mb-3">
              <label class="form-label text-warning">Descrizione</label>
              <textarea class="form-control bg-secondary text-white border-warning" id="deckDesc" rows="3"
                th:text="${deck.description}"></textarea>
            </div>
          </div>
          <div class="modal-footer border-warning">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
              Annulla
            </button>
            <button type="submit" class="btn btn-warning">Salva</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL: ELIMINA -->
  <div class="modal fade" id="deleteDeckModal" tabindex="-1" th:if="${isOwner}">
    <div class="modal-dialog">
      <div class="modal-content bg-dark border-danger">
        <div class="modal-header border-danger">
          <h5 class="modal-title text-danger">Elimina Mazzo</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-secondary">Questa azione è irreversibile.</p>
        </div>
        <div class="modal-footer border-danger">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Annulla
          </button>
          <button type="button" class="btn btn-danger" onclick="deleteDeck()">
            Elimina
          </button>
        </div>
      </div>
    </div>
  </div>
  </div>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <style>
    body {
      background: radial-gradient(circle at 20% 20%,
          rgba(123, 31, 162, 0.12),
          transparent 50%),
        radial-gradient(circle at 80% 80%,
          rgba(255, 193, 7, 0.08),
          transparent 50%),
        linear-gradient(180deg, #0a0e17 0%, #151a2b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 10px;
      border: 1px solid rgba(255, 193, 7, 0.3);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: linear-gradient(180deg, #ffc107 0%, #ff9800 100%);
      border-radius: 10px;
      border: 2px solid #1a1a2e;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: linear-gradient(180deg, #ffce3d 0%, #ffb74d 100%);
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.7);
    }

    .deck-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }



    .card-preview {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      display: none;
    }

    .card-preview img {
      width: 280px;
      border-radius: 14px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9),
        0 0 30px rgba(255, 193, 7, 0.5);
      border: 3px solid rgba(255, 193, 7, 0.6);
    }

    .context-menu {
      position: fixed;
      background: rgba(20, 20, 40, 0.98);
      border: 2px solid rgba(255, 193, 7, 0.3);
      border-radius: 8px;
      padding: 6px;
      display: none;
      z-index: 10000;
      min-width: 220px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
    }

    .context-item {
      padding: 10px 14px;
      cursor: pointer;
      color: #fff;
      border-radius: 4px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .context-item:hover {
      background: rgba(255, 193, 7, 0.2);
      transform: translateX(4px);
    }

    .context-item span {
      font-size: 18px;
    }

    .context-divider {
      height: 1px;
      background: rgba(255, 193, 7, 0.2);
      margin: 4px 0;
    }

    .context-danger:hover {
      background: rgba(220, 53, 69, 0.2);
      color: #ff6b6b;
    }

    .card-selector {
      position: relative;
      cursor: pointer;
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.3s;
      border: 2px solid transparent;
      background: #1a1f2e;
    }

    .card-selector img {
      width: 100%;
      aspect-ratio: 488/680;
      object-fit: cover;
      display: block;
    }

    .card-selector:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(255, 193, 7, 0.5);
      border-color: #ffc107;
    }

    .selector-qty {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffc107;
      font-weight: 900;
      font-size: 72px;
      text-shadow: 0 0 20px rgba(255, 193, 7, 1),
        0 0 40px rgba(255, 193, 7, 0.8), 0 0 60px rgba(255, 193, 7, 0.6),
        2px 2px 4px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      opacity: 0.9;
    }

    .no-image {
      width: 100%;
      aspect-ratio: 488/680;
      background: linear-gradient(135deg, #1a1f2e 0%, #2a1f3e 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 11px;
      text-align: center;
      padding: 10px;
    }

    .form-control:focus,
    .form-select:focus {
      background-color: #2a2f3a !important;
      color: #fff !important;
      border-color: #ffc107 !important;
      box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.25);
    }

    .progress {
      background: #1a1f2e;
    }
  </style>

  <script th:inline="javascript">
    const deckId = /*[[${deck.id}]]*/ null;
    const csrfToken = /*[[${_csrf.token}]]*/ "";
    const csrfHeader = /*[[${_csrf.headerName}]]*/ "X-CSRF-TOKEN";
    const isOwner = /*[[${isOwner}]]*/ false;
    let currentTotalCards = parseInt(/*[[${totalCards}]]*/ 0);
    const deckFormat = /*[[${deck.mainDeckFormat}]]*/ "standard";

    let allCards = [];
    let cardQuantities = new Map();
    let deckCards = /*[[${cards}]]*/[];
    let contextCardId = null;

    let currentPage = 1;
    let itemsPerPage = 50;
    let filteredCards = [];

    const FORMAT_RULES = {
      standard: { name: "Standard", maxCopies: 4, basicLandException: true },
      modern: { name: "Modern", maxCopies: 4, basicLandException: true },
      commander: {
        name: "Commander",
        maxCopies: 1,
        basicLandException: true,
        requiresCommander: true,
        deckSize: 100,
      },
      legacy: { name: "Legacy", maxCopies: 4, basicLandException: true },
    };

    const BASIC_LANDS = [
      "Plains",
      "Island",
      "Swamp",
      "Mountain",
      "Forest",
      "Snow-Covered Plains",
      "Snow-Covered Island",
      "Snow-Covered Swamp",
      "Snow-Covered Mountain",
      "Snow-Covered Forest",
      "Wastes",
    ];

    function isBasicLand(cardName) {
      return BASIC_LANDS.some((land) => cardName.includes(land));
    }

    function isLegalInFormat(card, format) {
      if (!card.legalities) return false;
      const formatKey = format.toUpperCase();
      return card.legalities[formatKey] === "legal";
    }

    function getMaxCopies(card, format) {
      if (isBasicLand(card.name)) return Infinity;
      const rules =
        FORMAT_RULES[format.toLowerCase()] || FORMAT_RULES.standard;
      return rules.maxCopies;
    }

    function categorizeCards(cards, sortBy = "name") {
      const categories = {
        Commander: [],
        Planeswalker: [],
        Creature: [],
        Instant: [],
        Sorcery: [],
        Artifact: [],
        Enchantment: [],
        Land: [],
      };

      cards.forEach((card) => {
        const typeline = card.typeline || "";
        if (typeline.includes("Legendary") && typeline.includes("Creature")) {
          categories.Commander.push(card);
        } else if (typeline.includes("Planeswalker")) {
          categories.Planeswalker.push(card);
        } else if (typeline.includes("Creature")) {
          categories.Creature.push(card);
        } else if (typeline.includes("Instant")) {
          categories.Instant.push(card);
        } else if (typeline.includes("Sorcery")) {
          categories.Sorcery.push(card);
        } else if (typeline.includes("Artifact")) {
          categories.Artifact.push(card);
        } else if (typeline.includes("Enchantment")) {
          categories.Enchantment.push(card);
        } else if (typeline.includes("Land")) {
          categories.Land.push(card);
        }
      });

      Object.keys(categories).forEach((key) => {
        categories[key].sort((a, b) => {
          if (sortBy === "name") return a.cardName.localeCompare(b.cardName);
          if (sortBy === "quantity")
            return parseInt(b.quantity) - parseInt(a.quantity);
          if (sortBy === "type") return a.typeline.localeCompare(b.typeline);
          return 0;
        });
      });

      return categories;
    }

    function renderCategories(sortBy = "name") {
      const categorized = categorizeCards(deckCards, sortBy);
      const container = document.getElementById("deckGridContainer");

      let html = "";
      Object.keys(categorized).forEach((categoryName) => {
        const cards = categorized[categoryName];
        if (cards.length === 0) return;

        html += `
            <div class="category-column categoryincolumn">
              <div class="category-header">
                <h6>${categoryName} (${cards.length})</h6>
              </div>
              <div class="card-list">
                <span class=></span>
                ${cards
            .map(
              (card) => `
                  <div class="card-row" 
                       data-card-id="${card.cardId}"
                       data-qty="${card.quantity}"
                       data-img="${card.imageUrl || ""}"
                       onclick="viewCardInfo('${card.cardId}')"
                       oncontextmenu="openContextMenu(event, '${card.cardId}')"
                       onmouseenter="showCardPreview(event)"
                       onmouseleave="hideCardPreview()"
                       onmousemove="updatePreviewPosition(event)">
                    <span class="card-qty">${card.quantity}</span>
                    <span class="card-name">${card.cardName}</span>
                    <span class="replaceCandidate">${card.refCard.manaCost}</span>
                  </div>
                `
            )
            .join("")}
              </div>
            </div>
          `;
      });

      container.innerHTML = html;
    }

    if (deckCards && deckCards.length > 0) {
      renderCategories();
    }

    document.getElementById("sortBy")?.addEventListener("change", (e) => {
      renderCategories(e.target.value);
    });

    function showCardPreview(e) {
      const row = e.currentTarget;
      const imgUrl = row.getAttribute("data-img");
      if (!imgUrl) return;

      const preview = document.getElementById("cardPreview");
      const previewImg = document.getElementById("cardPreviewImg");

      previewImg.src = imgUrl;
      preview.style.display = "block";
      updatePreviewPosition(e);
    }

    function updatePreviewPosition(e) {
      const preview = document.getElementById("cardPreview");
      if (preview.style.display !== "block") return;

      const offset = 20;
      preview.style.left = e.pageX + offset + "px";
      preview.style.top = e.pageY + offset + "px";
    }

    function hideCardPreview() {
      document.getElementById("cardPreview").style.display = "none";
    }

    function viewCardInfo(cardId) {
      window.location.href = `/cards/${cardId}`;
    }

    function openContextMenu(e, cardId) {
      e.preventDefault();
      contextCardId = cardId;
      const menu = document.getElementById("contextMenu");
      menu.style.display = "block";
      menu.style.left = e.pageX + "px";
      menu.style.top = e.pageY + "px";
    }

    document.addEventListener("click", () => {
      document.getElementById("contextMenu").style.display = "none";
    });

    function contextViewCard() {
      if (contextCardId) {
        window.location.href = `/cards/${contextCardId}`;
      }
    }

    async function contextAddCard() {
      if (!contextCardId || !isOwner) return;

      const row = document.querySelector(`[data-card-id="${contextCardId}"]`);
      const currentQty = parseInt(row.getAttribute("data-qty"));

      if (currentQty >= 4) {
        alert("⚠️ Massimo 4 copie per carta");
        return;
      }
      if (currentTotalCards >= 100) {
        alert("⚠️ Massimo 100 carte nel deck");
        return;
      }

      const res = await fetch(
        `/decks/public/${deckId}/cards/${contextCardId}/increase`,
        {
          method: "PUT",
          headers: { [csrfHeader]: csrfToken },
        }
      );

      if (res.ok) location.reload();
    }

    async function contextRemoveCard() {
      if (!contextCardId || !isOwner) return;

      const row = document.querySelector(`[data-card-id="${contextCardId}"]`);
      const currentQty = parseInt(row.getAttribute("data-qty"));

      if (currentQty > 1) {
        const res = await fetch(
          `/decks/public/${deckId}/cards/${contextCardId}/decrease`,
          {
            method: "PUT",
            headers: { [csrfHeader]: csrfToken },
          }
        );

        if (res.ok) location.reload();
      } else {
        alert('❌ Usa "Rimuovi Completamente"');
      }
    }

    async function contextDeleteCard() {
      if (!contextCardId || !isOwner) return;

      if (!confirm("⚠️ Rimuovere completamente?")) return;

      const res = await fetch(
        `/decks/public/${deckId}/cards/${contextCardId}`,
        {
          method: "DELETE",
          headers: { [csrfHeader]: csrfToken },
        }
      );

      if (res.ok) location.reload();
    }

    document
      .getElementById("addCardModal")
      ?.addEventListener("show.bs.modal", function () {
        if (allCards.length === 0) loadAllCards();
      });

    async function loadAllCards() {
      try {
        const res = await fetch("/decks/api/cards");
        allCards = (await res.json()) || [];
        console.log("✅ Carte caricate:", allCards.length);
        applyFilters();
      } catch (e) {
        console.error("❌ Errore:", e);
        alert("Errore caricamento");
      }
    }

    function applyFilters() {
      const search = document
        .getElementById("searchInput")
        .value.toLowerCase();
      const type = document.getElementById("typeFilter").value;
      const color = document.getElementById("colorFilter").value;
      const legality = document.getElementById("legalityFilter").value;

      filteredCards = allCards.filter((card) => {
        const matchSearch =
          !search || (card.name && card.name.toLowerCase().includes(search));
        const matchType =
          !type || (card.typeline && card.typeline.includes(type));

        let matchColor = true;
        if (color) {
          if (color === "C") {
            matchColor =
              !card.colorIdentity || card.colorIdentity.length === 0;
          } else {
            const cardColors = card.colorIdentity || [];
            matchColor = cardColors.includes(color);
          }
        }

        let matchLegality = true;
        if (legality) {
          const isLegal = isLegalInFormat(card, deckFormat);
          if (legality === "legal") {
            matchLegality = isLegal;
          } else if (legality === "not_legal") {
            matchLegality = !isLegal;
          }
        }

        return matchSearch && matchType && matchColor && matchLegality;
      });

      currentPage = 1;
      updatePagination();
      displayCards();
    }

    function updatePagination() {
      const totalPages = Math.ceil(filteredCards.length / itemsPerPage);
      document.getElementById("currentPage").textContent = currentPage;
      document.getElementById("totalPages").textContent = totalPages;
      document.getElementById("resultCount").textContent =
        filteredCards.length;

      document.getElementById("prevBtn").disabled = currentPage === 1;
      document.getElementById("nextBtn").disabled =
        currentPage === totalPages || totalPages === 0;
    }

    function nextPage() {
      const totalPages = Math.ceil(filteredCards.length / itemsPerPage);
      if (currentPage < totalPages) {
        currentPage++;
        displayCards();
        updatePagination();
      }
    }

    function prevPage() {
      if (currentPage > 1) {
        currentPage--;
        displayCards();
        updatePagination();
      }
    }

    function displayCards() {
      const start = (currentPage - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      const paginatedCards = filteredCards.slice(start, end);

      const html = paginatedCards
        .map((card) => {
          const qty = cardQuantities.get(card.id) || 0;
          const img = card.images?.normal || "";
          const isLegal = isLegalInFormat(card, deckFormat);

          const legalityBadge = isLegal
            ? '<span class="badge bg-success" style="position:absolute;top:4px;right:4px;font-size:10px;z-index:1;">✓</span>'
            : '<span class="badge bg-danger" style="position:absolute;top:4px;right:4px;font-size:10px;z-index:1;">✗</span>';

          const landBadge = isBasicLand(card.name)
            ? '<span class="badge bg-info" style="position:absolute;top:4px;left:4px;font-size:9px;z-index:1;">∞</span>'
            : "";

          return `
            <div class="col-6 col-sm-4 col-md-3 col-lg-2">
              <div class="card-selector" 
                   onclick="clickCard('${card.id}')" 
                   oncontextmenu="rightClickCard(event, '${card.id}')">
                ${legalityBadge}
                ${landBadge}
                ${img
              ? `<img src="${img}" loading="lazy" alt="${card.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">`
              : ""
            }
                <div class="no-image" style="${img ? "display:none" : "display:flex"
            }">
                  <div class="text-center">
                    <div class="mb-2">🃏</div>
                    <small>${card.name || "No Image"}</small>
                  </div>
                </div>
                ${qty > 0 ? `<div class="selector-qty">×${qty}</div>` : ""}
              </div>
            </div>
          `;
        })
        .join("");

      document.getElementById("cardGrid").innerHTML =
        html ||
        '<p class="text-secondary col-12 text-center">Nessun risultato</p>';
    }

    function getTotalCards() {
      return (
        currentTotalCards +
        Array.from(cardQuantities.values()).reduce((a, b) => a + b, 0)
      );
    }

    function updateTotalDisplay() {
      document.getElementById("totalCardsDisplay").textContent =
        currentTotalCards;
      const percentage = (currentTotalCards / 100) * 100;
      document.getElementById("progressBar").style.width = percentage + "%";
    }

    function updateStatus() {
      const total = getTotalCards();
      document.getElementById("currentTotal").textContent = total;
      document.getElementById("saveBtn").disabled = total > 100;
      const statusEl = document.getElementById("deckStatus");
      if (total > 100) {
        statusEl.style.borderColor = "#dc3545";
        statusEl.style.color = "#dc3545";
      } else {
        statusEl.style.borderColor = "#ffc107";
        statusEl.style.color = "#fff";
      }
    }

    function clickCard(id) {
      const card = allCards.find((c) => c.id === id);
      if (!card) return;

      const current = cardQuantities.get(id) || 0;
      const maxCopies = getMaxCopies(card, deckFormat);

      if (current >= maxCopies && maxCopies !== Infinity) {
        alert(`⚠️ Massimo ${maxCopies} copie per carta`);
        return;
      }

      const newTotal = currentTotalCards + 1;
      if (newTotal > 100) {
        alert("⚠️ Massimo 100 carte nel deck");
        return;
      }

      cardQuantities.set(id, current + 1);
      updateStatus();
      displayCards();
    }

    function rightClickCard(e, id) {
      e.preventDefault();
      const current = cardQuantities.get(id) || 0;
      if (current === 0) return;

      const newQty = current - 1;
      if (newQty === 0) {
        cardQuantities.delete(id);
      } else {
        cardQuantities.set(id, newQty);
      }

      updateStatus();
      displayCards();
    }

    async function saveSelectedCards() {
      if (getTotalCards() > 100) {
        alert("⚠️ Massimo 100 carte nel deck");
        return;
      }

      let saved = 0;
      for (const [id, qty] of cardQuantities) {
        const res = await fetch(
          `/decks/public/${deckId}/cards/${id}?quantity=${qty}`,
          {
            method: "POST",
            headers: { [csrfHeader]: csrfToken },
          }
        );
        if (res.ok) saved++;
      }
      alert(`✅ ${saved} carte aggiunte!`);
      location.reload();
    }

    function clearFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("typeFilter").value = "";
      document.getElementById("colorFilter").value = "";
      document.getElementById("legalityFilter").value = "";
      applyFilters();
    }

    document
      .getElementById("searchInput")
      ?.addEventListener("input", applyFilters);
    document
      .getElementById("typeFilter")
      ?.addEventListener("change", applyFilters);
    document
      .getElementById("colorFilter")
      ?.addEventListener("change", applyFilters);
    document
      .getElementById("legalityFilter")
      ?.addEventListener("change", applyFilters);

    document
      .getElementById("editForm")
      ?.addEventListener("submit", function (e) {
        e.preventDefault();
        fetch(
          `/decks/public/${deckId}?name=${encodeURIComponent(
            document.getElementById("deckName").value
          )}&description=${encodeURIComponent(
            document.getElementById("deckDesc").value
          )}`,
          {
            method: "PUT",
            headers: { [csrfHeader]: csrfToken },
          }
        ).then((r) => r.ok && location.reload());
      });

    function deleteDeck() {
      fetch(`/decks/public/${deckId}`, {
        method: "DELETE",
        headers: { [csrfHeader]: csrfToken },
      }).then((r) => r.ok && (window.location = "/decks/mydecks"));
    }
  </script>
  <script src="/js/cardrotate.js" defer></script>

</body>

</html>
