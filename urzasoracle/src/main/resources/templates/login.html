<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/head :: head"></head>
  <body>
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container py-5 d-flex justify-content-center">
      <div class="card card-bg p-4" style="width: 400px">
        <h3 class="text-center text-warning mb-4">Accedi</h3>
        <form th:action="@{/login}" method="post">
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              class="form-control"
              required
            />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              required
            />
          </div>
          <button type="submit" class="btn btn-warning w-100">Entra</button>
          <p class="mt-3 text-center">
            Non hai un account?
            <a class="text-warning text-decoration-none" th:href="@{/register}"
              >Registrati</a
            >
          </p>
        </form>
      </div>
    </div>

    <div th:replace="fragments/footer :: footer"></div>
  </body>
</html>
