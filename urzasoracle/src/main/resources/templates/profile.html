<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Profilo - Urza\'s Oracle')}"></head>

<body class="bg-dark text-light">
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card bg-dark border-warning shadow-lg">
          <div class="card-header bg-dark border-warning p-4 text-center">
            <h1 class="text-warning fw-bold mb-2" style="text-shadow: 0 0 20px rgba(255, 193, 7, 0.5)">
              Profile
            </h1>
            <p class="text-secondary mb-0">
              Modify your account information.
            </p>
          </div>

          <div class="card-body p-5">
            <h5 class="text-warning fw-bold mb-4 border-bottom border-warning pb-2">
              Account information
            </h5>

            <form th:action="@{/profile/update}" method="post" class="mb-5">
              <div class="mb-4">
                <label for="username" class="form-label text-warning fw-bold">Username</label>
                <input type="text" id="username"
                  class="form-control bg-dark text-secondary border-warning form-control-lg" th:value="${user.username}"
                  disabled />
              </div>

              <div class="mb-4">
                <label for="email" class="form-label text-warning fw-bold">Email</label>
                <input type="email" id="email" name="email"
                  class="form-control bg-dark text-warning border-warning form-control-lg" th:value="${user.email}"
                  required />
              </div>

              <div class="mb-4">
                <label for="displayName" class="form-label text-warning fw-bold">Display name</label>
                <input type="text" id="displayName" name="displayName"
                  class="form-control bg-dark text-warning border-warning form-control-lg"
                  th:value="${user.displayName}" placeholder="Come vuoi essere visto" maxlength="50" />
              </div>

              <div class="mb-4">
                <label for="registerDate" class="form-label text-warning fw-bold">Member since:</label>

                <input type="text" id="registerDate"
                  class="form-control bg-dark text-secondary border-warning form-control-lg"
                  th:value="${#dates.format(user.registerDate, 'dd MMMM yyyy')}" disabled />
              </div>

              <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold shadow mb-3">
                Save
              </button>
            </form>

            <div class="text-center mb-4">
              <button type="button" class="btn btn-outline-warning fw-bold" onclick="togglePasswordSection()"
                id="togglePasswordBtn">
                Change password
              </button>
            </div>

            <div id="passwordSection" style="display: none" class="mb-5">
              <h5 class="text-warning fw-bold mb-4 border-bottom border-warning pb-2">
                Change password
              </h5>

              <form th:action="@{/profile/change-password}" method="post">
                <div class="mb-4">
                  <label for="currentPassword" class="form-label text-warning fw-bold">Old password</label>
                  <input type="password" id="currentPassword" name="currentPassword"
                    class="form-control bg-dark text-warning border-warning form-control-lg" placeholder="" required />
                </div>

                <div class="mb-4">
                  <label for="newPassword" class="form-label text-warning fw-bold">New password</label>
                  <input type="password" id="newPassword" name="newPassword"
                    class="form-control bg-dark text-warning border-warning form-control-lg" placeholder="" required />

                </div>

                <div class="mb-4">
                  <label for="confirmNewPassword" class="form-label text-warning fw-bold">Confirm new password</label>
                  <input type="password" id="confirmNewPassword" name="confirmNewPassword"
                    class="form-control bg-dark text-warning border-warning form-control-lg" placeholder="" required />
                </div>

                <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold shadow mb-3">
                  Submit password change request
                </button>

                <button type="button" class="btn btn-outline-secondary w-100 fw-bold" onclick="togglePasswordSection()">
                  Cancel
                </button>
              </form>
            </div>
            <div th:if="${user.admin}" th:replace="~{fragments/adminpanel :: adminpanel}"></div>
          </div>
        </div>
      </div>
    </div>
  </main>



  <div th:replace="~{fragments/footer :: footer}"></div>

  <script>
    
  </script>
</body>

</html>
