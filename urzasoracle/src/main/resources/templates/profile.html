<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head
    th:replace="~{fragments/head :: head('Profilo - Urza\'s Oracle')}"
  ></head>

  <body class="bg-dark text-light">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <!-- Box Unica Profilo -->
          <div class="card bg-dark border-warning shadow-lg">
            <div class="card-header bg-dark border-warning p-4 text-center">
              <h1
                class="text-warning fw-bold mb-2"
                style="text-shadow: 0 0 20px rgba(255, 193, 7, 0.5)"
              >
                Il Mio Profilo
              </h1>
              <p class="text-secondary mb-0">
                Gestisci le informazioni del tuo account
              </p>
            </div>

            <div class="card-body p-5">
              <!-- Form Informazioni Personali -->
              <h5
                class="text-warning fw-bold mb-4 border-bottom border-warning pb-2"
              >
                Informazioni Personali
              </h5>

              <form th:action="@{/profile/update}" method="post" class="mb-5">
                <div class="mb-4">
                  <label for="username" class="form-label text-warning fw-bold"
                    >Username</label
                  >
                  <input
                    type="text"
                    id="username"
                    class="form-control bg-dark text-secondary border-warning form-control-lg"
                    th:value="${user.username}"
                    disabled
                  />
                  <small class="text-muted"
                    >Il tuo username non può essere modificato</small
                  >
                </div>

                <div class="mb-4">
                  <label for="email" class="form-label text-warning fw-bold"
                    >Email</label
                  >
                  <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control bg-dark text-warning border-warning form-control-lg"
                    th:value="${user.email}"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label
                    for="displayName"
                    class="form-label text-warning fw-bold"
                    >Nome Visualizzato</label
                  >
                  <input
                    type="text"
                    id="displayName"
                    name="displayName"
                    class="form-control bg-dark text-warning border-warning form-control-lg"
                    th:value="${user.displayName}"
                    placeholder="Come vuoi essere visto"
                    maxlength="50"
                  />
                </div>

                <div class="mb-4">
                  <label
                    for="registerDate"
                    class="form-label text-warning fw-bold"
                    >Membro da</label
                  >
                  <input
                    type="text"
                    id="registerDate"
                    class="form-control bg-dark text-secondary border-warning form-control-lg"
                    th:value="${#temporals.format(user.registerDate, 'dd MMMM yyyy')}"
                    disabled
                  />
                </div>

                <button
                  type="submit"
                  class="btn btn-warning btn-lg w-100 fw-bold shadow mb-3"
                >
                  Salva Modifiche
                </button>
              </form>

              <!-- Bottone per mostrare Cambio Password -->
              <div class="text-center mb-4">
                <button
                  type="button"
                  class="btn btn-outline-warning fw-bold"
                  onclick="togglePasswordSection()"
                  id="togglePasswordBtn"
                >
                  Cambia Password
                </button>
              </div>

              <!-- Sezione Cambio Password (Nascosta di default) -->
              <div id="passwordSection" style="display: none">
                <h5
                  class="text-warning fw-bold mb-4 border-bottom border-warning pb-2"
                >
                  Cambia Password
                </h5>

                <form th:action="@{/profile/change-password}" method="post">
                  <div class="mb-4">
                    <label
                      for="currentPassword"
                      class="form-label text-warning fw-bold"
                      >Password Attuale</label
                    >
                    <input
                      type="password"
                      id="currentPassword"
                      name="currentPassword"
                      class="form-control bg-dark text-warning border-warning form-control-lg"
                      placeholder="Inserisci la tua password attuale"
                      required
                    />
                  </div>

                  <div class="mb-4">
                    <label
                      for="newPassword"
                      class="form-label text-warning fw-bold"
                      >Nuova Password</label
                    >
                    <input
                      type="password"
                      id="newPassword"
                      name="newPassword"
                      class="form-control bg-dark text-warning border-warning form-control-lg"
                      placeholder="Crea una nuova password"
                      minlength="6"
                      required
                    />
                    <small class="text-muted">Minimo 6 caratteri</small>
                  </div>

                  <div class="mb-4">
                    <label
                      for="confirmNewPassword"
                      class="form-label text-warning fw-bold"
                      >Conferma Nuova Password</label
                    >
                    <input
                      type="password"
                      id="confirmNewPassword"
                      name="confirmNewPassword"
                      class="form-control bg-dark text-warning border-warning form-control-lg"
                      placeholder="Ripeti la nuova password"
                      minlength="6"
                      required
                    />
                  </div>

                  <button
                    type="submit"
                    class="btn btn-warning btn-lg w-100 fw-bold shadow mb-3"
                  >
                    Conferma Cambio Password
                  </button>

                  <button
                    type="button"
                    class="btn btn-outline-secondary w-100 fw-bold"
                    onclick="togglePasswordSection()"
                  >
                    Annulla
                  </button>
                </form>
              </div>

              <!-- Sezione Logout -->
              <div class="text-center mt-5 pt-4 border-top border-secondary">
                <p class="text-secondary mb-3">Vuoi uscire dal tuo account?</p>
                <form
                  th:action="@{/auth/logout}"
                  method="post"
                  class="d-inline"
                >
                  <button
                    type="submit"
                    class="btn btn-outline-danger btn-lg fw-bold px-5"
                  >
                    Logout
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <style>
      body {
        background: linear-gradient(
          180deg,
          #0b0f1a 0%,
          #1a1033 50%,
          #0b0f1a 100%
        );
        font-family: "Roboto", sans-serif;
        min-height: 100vh;
      }

      .card {
        border-radius: 0.5rem;
        transition: all 0.3s ease;
      }

      .card:hover {
        box-shadow: 0 0 30px rgba(255, 193, 7, 0.3) !important;
      }

      .form-control {
        transition: all 0.3s ease;
      }

      .form-control:focus {
        background-color: #1a1a1a;
        color: #ffc107;
        border-color: #ffc107;
        box-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
      }

      .form-control:disabled {
        background-color: #0f1419;
        border-color: #495057;
      }

      .btn-warning:hover {
        background-color: #ffce3d;
        transform: scale(1.02);
        box-shadow: 0 0 20px rgba(255, 193, 7, 0.5);
      }

      .btn-outline-warning:hover {
        background-color: #ffc107;
        color: #000;
        box-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
      }

      .btn-outline-danger:hover {
        background-color: #dc3545;
        color: #fff;
        box-shadow: 0 0 15px rgba(220, 53, 69, 0.4);
      }

      .btn-outline-secondary:hover {
        background-color: #6c757d;
        color: #fff;
      }

      h1,
      h5 {
        letter-spacing: 0.5px;
      }

      #passwordSection {
        animation: fadeIn 0.3s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

    <script>
      function togglePasswordSection() {
        const section = document.getElementById("passwordSection");
        const btn = document.getElementById("togglePasswordBtn");

        if (section.style.display === "none") {
          section.style.display = "block";
          btn.style.display = "none";
        } else {
          section.style.display = "none";
          btn.style.display = "inline-block";
        }
      }
    </script>
  </body>
</html>
