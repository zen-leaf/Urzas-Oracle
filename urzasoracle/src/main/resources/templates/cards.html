<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Search cards')}"></head>

<body class="bg-dark text-light">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container-fluid py-5">

    <header class="text-center mb-5">
      <h1 class="display-1 fw-bold text-warning mb-3">Card list</h1>
      <p class=" text-secondary mb-4">Browse all cards in our database</p>

      <form th:action="@{/cards}" method="get" class="mx-auto" style="max-width:700px;">
        <div class="input-group input-group-lg shadow">
          <input type="text" name="q" class="form-control bg-dark text-warning border-warning"
            placeholder="" th:value="${lastQuery}">
          <button class="btn btn-warning fw-bold" type="submit">Cerca</button>
          <th:block th:if="${query != ''}">
            <a th:href="@{/cards}" class="btn btn-outline-warning">Reset</a>
          </th:block>
          
        </div>
      </form>
      <p class=" text-secondary mb-4">available filters: "name", "cmc", "set" </p>
    </header>

    <section>
      <div class="text-center mb-4">
        <span class="badge bg-warning text-dark fs-6 px-3 py-2 shadow-sm">
          <span th:text="${totElements}"></span> carte trovate
        </span>
      </div>

      <div th:if="${lista == null or #lists.isEmpty(lista)}" class="alert alert-warning text-center mx-auto"
        style="max-width: 600px;">
        <h5 class="alert-heading">No card found</h5>
        <p>Either the search terms are wrong or we're missing the card!</p>
        <a th:href="@{/cards}" class="btn btn-sm btn-warning">Show all</a>
      </div>

      <div class="row g-4 justify-content-center" th:if="${not #lists.isEmpty(lista)}">
        <th:block th:each="card : ${lista}">
          <div class="col-12 col-sm-6 col-md-4 col-lg-3 col-xl-2">

            <a th:href="@{/cards/{id}(id=${card.id})}" class="text-decoration-none card-link-wrapper">
              <div class="card mtg-card bg-dark border-secondary h-100 shadow-sm card-hover card-face">


                <div class="mtg-card-frame">

                  <div class="card-data-overlay">
                    <!-- Nome -->
                    <div th:text="${card.name}"></div>

                    <!-- Tipo -->
                    <div th:text="${card.typeline}"></div>

                    <!-- Set -->
                    <div th:if="${card.expansionSet != null}" th:text="${card.expansionSet.name}"></div>

                    <!-- Artisti -->

                    <span th:text="${#strings.listJoin(card.artistNames, ', ')}"></span>
                    </span>


                    <!-- Colori -->
                    <div th:if="${card.colorIdentity != null and !#lists.isEmpty(card.colorIdentity)}">
                      <span th:each="c, stat : ${card.colorIdentity}">
                        <span th:text="${c}"></span><span th:if="${not stat.last}">, </span>
                      </span>
                    </div>

                    <!-- Legalità -->
                    <div th:if="${card.legalities != null}" th:text="${card.legalities.get('standard')}"></div>
                  </div>

                  <img th:if="${card.images != null and card.images.get('normal') != null}"
                    th:src="${card.images.get('normal')}" th:alt="${card.name}" class="mtg-card-img" loading="lazy">
                </div>

                <div class="card-body p-3">
                  <!-- Tutto il contenuto del card-body è COMPLETAMENTE NASCOSTO - i dati sono sopra nella carta invisibile -->

                </div>
              </div>
            </a>
          </div>
        </th:block>
      </div>
    </section>

    <nav th:if="${totalPages > 1}" class="d-flex justify-content-center mt-5">
      <ul class="pagination pagination-lg">
        <li class="page-item" th:classappend="${currentPage==0} ? 'disabled'">
          <a class="page-link bg-dark text-warning border-warning"
            th:href="@{/cards(page=${currentPage - 1}, q=${query})}">&laquo;</a>
        </li>
        

        <li class="page-item" th:each="i : ${#numbers.sequence(0, 8)}"
          th:classappend="${i== 4} ? 'active'" th:if="${currentPage+i-4>=0}">
          <a class="page-link bg-dark text-warning border-warning" th:href="@{/cards(page=${currentPage + i -4}, q=${lastQuery})}"
            th:text="${currentPage + i -3}"></a>
        </li>

        <li class="page-item" th:classappend="${currentPage ==totalPages} ? 'disabled'">
          <a class="page-link bg-dark text-warning border-warning"
            th:href="@{/cards(page=${currentPage + 1}, q=${query})}">&raquo;</a>
        </li>
      </ul>
    </nav>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <style>
    /* Sfondo con effetto nebula viola-oro */
    body {
      background:
        radial-gradient(60% 40% at 20% 10%, rgba(123, 31, 162, .15), transparent 60%),
        radial-gradient(50% 35% at 80% 20%, rgba(255, 193, 7, .08), transparent 60%),
        linear-gradient(180deg, #0b0f1a 0%, #1a1033 50%, #0b0f1a 100%);
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
    }

    /* Carta MTG con bordo arrotondato */
    .mtg-card {
      border-radius: 0.75rem;
      overflow: hidden;
      position: relative;
    }

    /* Frame con proporzioni Scryfall (488x680) */
    .mtg-card-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 488 / 680;
      background: radial-gradient(80% 60% at 50% 40%, rgba(255, 193, 7, .08), rgba(123, 31, 162, .06) 60%, transparent 100%);
      border-bottom: 1px solid #333;
    }

    /* TUTTI i dati della carta invisibili ma ricercabili - sopra l'immagine */
    .card-data-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      color: transparent;
      text-shadow: none;
      background: none;
      pointer-events: none;
      z-index: 10;
      overflow: hidden;
      line-height: 1.4;
      padding: 0.5rem;
      font-size: 0.875rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Immagine carta senza tagli */
    .mtg-card-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }

    /* Link wrapper senza decorazione */
    .card-link-wrapper {
      display: block;
      text-decoration: none !important;
      color: inherit;
    }

    /* Hover con glow magico potenziato */
    .card-hover:hover {
      transform: translateY(-8px);
      transition: all .25s ease-in-out;
      border-color: #ffc107 !important;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, .4),
        0 0 28px rgba(255, 193, 7, 0.4),
        0 0 20px rgba(123, 31, 162, 0.3);
    }

    /* Effetto luminoso sull'immagine all'hover */
    .mtg-card:hover .mtg-card-img {
      filter: drop-shadow(0 2px 10px rgba(255, 193, 7, .3)) saturate(1.05) contrast(1.05);
      transition: filter .25s ease;
    }

    /* Particelle magiche leggere */
    .mtg-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(2px 2px at 20% 30%, rgba(255, 193, 7, .4), transparent 60%),
        radial-gradient(1.5px 1.5px at 65% 25%, rgba(123, 31, 162, .4), transparent 60%),
        radial-gradient(1.8px 1.8px at 80% 70%, rgba(255, 255, 255, .3), transparent 60%);
      opacity: 0;
      transition: opacity .25s ease;
      z-index: 5;
    }

    .mtg-card:hover::after {
      opacity: .5;
    }

    .page-item.active .page-link {
      background-color: #ffc107 !important;
      color: #000 !important;
      border-color: #ffc107 !important;
    }

    .page-link:hover {
      background-color: #ffce3d !important;
      color: #000 !important;
    }

    .form-control:focus {
      background-color: #1a1a1a;
      color: #ffc107;
      border-color: #ffc107;
      box-shadow: 0 0 10px rgba(255, 193, 7, 0.3);
    }

    .card {
          border-radius: 8%/5%;
      transition: all .3s ease;
    }

    .pagination .page-link {
      background-color: #1a1a1a;
      color: #ffc107;
      border-color: #ffc107;
    }

    /* card-body completamente vuoto */
    .card-body {
      padding: 0 !important;
      min-height: 0 !important;
      display: none !important;
    }
  </style>
</body>

</html>
