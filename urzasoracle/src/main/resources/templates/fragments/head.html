<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${pageTitle} ?: 'Urza\'s Oracle'">Urza's Oracle</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />

  <link href="/css/urzastyle.css" rel="stylesheet" />

  <style>
    @font-face {
      font-family: "MioFont";
      /* Cambia con il nome del tuo font */
      src: url("/fonts/MatrixB.ttf") format("ttf"),
        url("/fonts/MatrixB.ttf") format("ttf"),
        url("/fonts/MatrixB.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
    }

    /* Applica il font a tutto il sito */
    * {
      font-family: "MioFont", sans-serif;
    }

    /* Opzionale: caratteri speciali per titoli */
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: "MioFont", serif;
      letter-spacing: 1px;
    }
  </style>
</head>
