<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Collezioni')}"></head>
<body class="bg-dark text-light">
  <header th:replace="~{fragments/navbar :: navbar}"></header>

  <main class="container py-4">
    <!-- Header Section with Glow Effect -->
    <div class="card bg-dark border-secondary mb-4">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center">
          <h1 class="display-6 mb-0" style="text-shadow: 0 0 30px rgba(255, 193, 7, 0.6);">Le mie collezioni</h1>
          <a class="btn btn-outline-warning" th:href="@{/cardCollections}">
            <i class="bi bi-plus-circle me-2"></i>Nuova collezione
          </a>
        </div>
      </div>
    </div>

    <!-- Alert for empty collections -->
    <div class="alert alert-secondary border-secondary" 
         th:if="${cardCollections == null or #lists.isEmpty(cardCollections)}">
      <i class="bi bi-info-circle me-2"></i>Nessuna collezione trovata.
    </div>

    <!-- Collections Grid -->
    <div class="row g-4" th:if="${cardCollections != null and !#lists.isEmpty(cardCollections)}">
      <div class="col-sm-6 col-lg-4" th:each="c : ${cardCollections}">
        <div class="card h-100 bg-dark border-secondary hover-card">
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <h5 class="card-title text-warning mb-0" th:text="${c.name}">Nome collezione</h5>
              <span class="badge bg-secondary" th:text="${c.format}">Formato</span>
            </div>
            
            <p class="card-text text-muted small mb-3" th:text="${c.description}">Descrizione breve</p>

            <div class="mt-auto">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <small class="text-muted">
                  <i class="bi bi-collection me-1"></i>
                  <span th:text="${c.cardCount != null ? c.cardCount : 0}">0</span> carte
                </small>
                <small class="text-muted">
                  <i class="bi bi-person me-1"></i>
                  <span th:text="${c.owner != null ? c.owner.username : 'utente'}">owner</span>
                </small>
              </div>

              <div class="btn-group w-100">
                <a class="btn btn-sm btn-outline-primary" th:href="@{|/cardCollections/${c.id}|}">
                  <i class="bi bi-eye me-1"></i>Visualizza
                </a>
                <a class="btn btn-sm btn-outline-warning" th:href="@{|/cardCollections/${c.id}/edit|}">
                  <i class="bi bi-pencil me-1"></i>Modifica
                </a>
                <a class="btn btn-sm btn-outline-danger" th:href="@{|/cardCollections/${c.id}/delete|}"
                   onclick="return confirm('Eliminare questa collezione?');">
                  <i class="bi bi-trash me-1"></i>Elimina
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="fragments/footer :: footer"></footer>

  <style>
    .hover-card {
      transition: transform 0.2s ease-in-out;
    }
    .hover-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0.5rem 1rem rgba(255, 193, 7, 0.15);
    }
    .card {
      background: linear-gradient(180deg, #2b3035 0%, #212529 100%);
    }
  </style>
</body>
</html>
