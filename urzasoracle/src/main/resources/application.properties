spring.application.name=urzasoracle

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.url=jdbc:mysql://localhost:3306/urzas_db?useSSL=false&serverTimezone=UTC

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#con none non fa nulla in automatico per le ddl
#create -> crea e distrugge ogni volta
#update -> aggiorna lo schema se necessario oppure se non c'è lo crea 
#validate -> controlla la struttura del db 
spring.jpa.hibernate.ddl-auto=create

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

